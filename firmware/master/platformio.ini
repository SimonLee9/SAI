; S.A.I Master Node Firmware
; Platform: ESP32-S3-DevKitC-1 (N8R8)

[env:master]
; Official espressif32 — Arduino-ESP32 v2 / ESP-IDF 4. Required because
; ESP32-A2DP rejects v3 with a #error in BluetoothA2DPCommon.h. sai_audio
; uses the legacy driver/i2s.h API that ships with this platform.
; If/when ESP32-A2DP supports v3, revisit and switch to the pioarduino
; fork + i2s_std.h together.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
lib_extra_dirs = ../shared/lib    ; sai_config / sai_led / sai_audio / sai_bt 라이브러리 검색
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSAI_NODE_ROLE=0          ; 0 = MASTER
    -DSAI_VERSION=\"0.1.0\"

lib_deps =
    ; ESP32-A2DP — fetch directly from GitHub. The PlatformIO registry
    ; entry resolution has been flaky (bare name and owner-prefixed both
    ; failed in CI). Git URL is the unambiguous form.
    https://github.com/pschatzmann/ESP32-A2DP.git
    fastled/FastLED             ; WS2812B LED control
    kosme/arduinoFFT@^2.0.0     ; FFT for audio-reactive visualization
    ; pschatzmann/arduino-audio-tools  ; Advanced audio (Phase 2)
