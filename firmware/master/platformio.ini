; S.A.I Master Node Firmware
; Platform: ESP32-S3-DevKitC-1 (N8R8)

[env:master]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSAI_NODE_ROLE=0          ; 0 = MASTER
    -DSAI_VERSION=\"0.1.0\"

lib_deps =
    ESP32-A2DP                  ; Bluetooth audio sink
    fastled/FastLED             ; WS2812B LED control
    ; pschatzmann/arduino-audio-tools  ; Advanced audio (Phase 2)
