; S.A.I Master Node Firmware
; Platform: ESP32 (original) — only variant with Bluetooth Classic + A2DP.
; ESP32-S3 was the original choice but its radio is BLE-only; A2DP requires
; Classic BT, which is hardware-locked to the original ESP32. Decision
; documented in docs/technical/DESIGN.md §3.

[env:master]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../shared/lib    ; sai_config / sai_led / sai_audio / sai_bt 라이브러리 검색
build_flags =
    -DSAI_NODE_ROLE=0          ; 0 = MASTER
    -DSAI_VERSION=\"0.1.0\"

lib_deps =
    ; ESP32-A2DP — fetch directly from GitHub. The PlatformIO registry
    ; entry resolution has been flaky (bare name and owner-prefixed both
    ; failed in CI). Git URL is the unambiguous form.
    https://github.com/pschatzmann/ESP32-A2DP.git
    fastled/FastLED             ; WS2812B LED control
    kosme/arduinoFFT@^2.0.0     ; FFT for audio-reactive visualization
    ; pschatzmann/arduino-audio-tools  ; Advanced audio (Phase 2)
