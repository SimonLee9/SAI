; S.A.I Master Node Firmware
; Platform: ESP32-S3-DevKitC-1 (N8R8)

[env:master]
; pioarduino fork — Arduino-ESP32 v3 + ESP-IDF 5.x. Required for sai_audio's
; new I2S "std" API (driver/i2s_std.h). The official `espressif32` registry
; entry is still on IDF 4 as of mid-2026 and won't resolve that header.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
lib_extra_dirs = ../shared/lib    ; sai_config / sai_led / sai_audio / sai_bt 라이브러리 검색
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSAI_NODE_ROLE=0          ; 0 = MASTER
    -DSAI_VERSION=\"0.1.0\"

lib_deps =
    pschatzmann/ESP32-A2DP      ; Bluetooth audio sink (canonical owner/name)
    fastled/FastLED             ; WS2812B LED control
    kosme/arduinoFFT@^2.0.0     ; FFT for audio-reactive visualization
    ; pschatzmann/arduino-audio-tools  ; Advanced audio (Phase 2)
