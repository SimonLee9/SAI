; S.A.I Satellite Node Firmware
; Platform: ESP32-S3-DevKitC-1 (N8R8)

[env:satellite]
; pioarduino fork — match master env so Phase 2 satellite work (sai_audio
; RX, sai_sync over ESP-NOW) can use ESP-IDF 5 APIs without surprise.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
lib_extra_dirs = ../shared/lib    ; sai_config / sai_led / sai_audio (sai_bt는 사용 안 함)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSAI_NODE_ROLE=1          ; 1 = SATELLITE
    -DSAI_VERSION=\"0.1.0\"

lib_deps =
    fastled/FastLED
    kosme/arduinoFFT@^2.0.0     ; pre-added for Phase 2 satellite visualization parity
