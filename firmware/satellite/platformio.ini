; S.A.I Satellite Node Firmware
; Platform: ESP32 (original) — match master for library/pin parity.
; ESP-NOW (Phase 2 sync) works on all ESP32 variants, but keeping the
; same chip across nodes simplifies firmware maintenance.

[env:satellite]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../shared/lib    ; sai_config / sai_led / sai_audio (sai_bt는 사용 안 함)
build_flags =
    -DSAI_NODE_ROLE=1          ; 1 = SATELLITE
    -DSAI_VERSION=\"0.1.0\"

lib_deps =
    fastled/FastLED
    kosme/arduinoFFT@^2.0.0     ; pre-added for Phase 2 satellite visualization parity
