<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF7F2" />

    <title>S.A.I — 공간과 소리, 그 사이를 채우는 지능</title>
    <meta name="description" content="한국적 곡선미와 ESP32-S3 음향 기술이 만나는 모듈러 블루투스 스피커. 음악에 반응하는 빛, 무선으로 확장되는 스테레오." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="S.A.I — Spatial Acoustic Intelligence" />
    <meta property="og:description" content="공간과 소리, 그 사이를 채우는 지능." />
    <meta property="og:locale" content="ko_KR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="S.A.I — Spatial Acoustic Intelligence" />
    <meta name="twitter:description" content="공간과 소리, 그 사이를 채우는 지능." />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"
    />

    <!-- No-flash mode init: runs before React mounts so :root.dark is set
         on first paint, no light-then-dark flicker on dark-pref devices. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("sai.theme");
          var prefersDark = window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = saved === "dark" || (saved == null && prefersDark);
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) { /* private mode etc. — ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
